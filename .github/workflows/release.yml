name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build and package
        run: npm run package

      - name: Verify packaged extension files
        run: |
          unzip -l release/MultiAI-Answer-v$(node -p "require('./manifest.json').version").zip
          unzip -p release/MultiAI-Answer-v$(node -p "require('./manifest.json').version").zip MultiAI-Answer/manifest.json
          unzip -l release/MultiAI-Answer-v$(node -p "require('./manifest.json').version").zip | grep -E 'MultiAI-Answer/dist/(content|background|auth-content)\.js'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MultiAI Answer v${{ github.ref_name }}
          generate_release_notes: true
          files: release/MultiAI-Answer-v*.zip
